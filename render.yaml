# NEXA Leads — Render blueprint.
#
# Data lives in Postgres (Supabase), reached over the network via
# DATABASE_URL, so this service itself is stateless — no persistent disk to
# attach, which means it can run on Render's free tier. Research still runs
# in the background within one long-lived process, so it needs a process
# that stays alive between requests (which the free tier also provides; it
# just sleeps after inactivity on the free plan).

services:
  - type: web
    name: nexa-leads
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    # A "Deploy to Render" button should not auto-redeploy on every push to
    # this repository; each click creates its own independent instance.
    autoDeploy: false
    envVars:
      # Generated once by Render and never shown in the repository.
      - key: SESSION_SECRET
        generateValue: true
      # Set this in the Render dashboard to a Postgres connection string from
      # Supabase → Settings → Database → Connection string. Use the "Session
      # pooler" or "Transaction pooler" form (not "Direct connection" — that
      # one is IPv6-only and most PaaS networks, Render included, can't reach
      # it). Left unset here so no connection string is ever committed.
      - key: DATABASE_URL
        sync: false
      - key: DEFAULT_COUNTRY
        value: DE
      - key: DEFAULT_TIMEZONE
        value: Europe/Berlin
      # Start on the built-in demo dataset, then switch these to real providers
      # in the Render dashboard once you have added the matching API keys.
      - key: DISCOVERY_PROVIDER
        value: fixture
      - key: GEOCODING_PROVIDER
        value: fixture
      - key: WEB_SEARCH_PROVIDER
        value: none
      - key: PHOTO_PROVIDER
        value: none
      - key: OSM_USER_AGENT
        value: NexaLeads/1.0 (self-hosted)
      # Set these in the dashboard when you switch providers on. Leave unset
      # here so no key is ever committed.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_CSE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ENGINE_ID
        sync: false
      # APP_URL is optional on Render: the app falls back to RENDER_EXTERNAL_URL.
      - key: APP_URL
        sync: false
